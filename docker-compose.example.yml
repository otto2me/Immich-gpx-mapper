services:
  immich-gpx-mapper:
    image: ghcr.io/otto2me/immich-gpx-mapper:latest
    container_name: immich-gpx-mapper
    restart: unless-stopped
    environment:
      IMMICH_API_URL: ${IMMICH_API_URL:-http://immich-server:2283}
      IMMICH_WEB_URL: ${IMMICH_WEB_URL:-}
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:?Set INITIAL_ADMIN_USERNAME in .env}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env}
      BACKUP_PASSPHRASE_FILE: /run/secrets/backup_passphrase
      DATA_DIR: /data
      BACKUP_DIR: /backups
      CONFIG_FILE: /data/config.json
      PORT: 3000
    secrets:
      - backup_passphrase
    volumes:
      - ./immich-gpx-mapper-data:/data
      - ./immich-gpx-mapper-backups:/backups
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - immich-network

networks:
  immich-network:
    external: true
    name: ${IMMICH_DOCKER_NETWORK:-immich_default}

secrets:
  backup_passphrase:
    file: ${BACKUP_PASSPHRASE_FILE:?Set BACKUP_PASSPHRASE_FILE in .env}
